<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>파운드 현황 연결</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6f0;color:#19372b;font:15px/1.8 system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;padding:24px}main{width:100%;max-width:560px;background:white;border:1px solid #dbe4d6;border-radius:20px;padding:36px}small{color:#627967}h1{font-size:27px;line-height:1.5;letter-spacing:-1px}p{color:#637669}.status{padding:18px;background:#edf4e7;border-radius:12px;overflow-wrap:anywhere}a,button{display:inline-block;background:#235c46;color:white;padding:13px 18px;border:0;border-radius:9px;text-decoration:none;font:inherit;cursor:pointer;margin:14px 6px 0 0}button:disabled{opacity:.5;cursor:wait}.secondary{background:#eef2e9;color:#235c46}.error{background:#fff0ea;color:#9e4f36}[hidden]{display:none!important}.row{border-bottom:1px solid #e4eadf;padding:10px 0;font-size:13px;overflow-wrap:anywhere}</style></head><body><main><small>POUND · SITE CONNECTION</small><h1>기존 관리자 로그인으로<br>콘텐츠 현황을 연결합니다.</h1><p id="site">서비스 정보를 확인하고 있습니다.</p><div class="status" id="status" role="status">이 사이트의 로그인 상태를 확인하는 중입니다…</div><div id="results"></div><a id="login" hidden target="_blank" rel="noopener noreferrer">이 사이트에서 관리자 로그인 ↗</a><button id="retry" class="secondary" hidden>로그인 상태 다시 확인</button><button id="storage-check" class="secondary" hidden>Storage만 조회</button><a id="return" hidden>관제센터에서 확인하기 ↗</a><p><small>로그인 인증은 이 사이트에 유지됩니다. 관제센터에는 컬렉션 구조·건수·목록 일부·확인 시각만 전달합니다.</small></p></main><script>
window.poundBootTimer=setTimeout(()=>{const el=document.getElementById('status');el.textContent='연결 초기화가 지연되고 있습니다. 네트워크 또는 연결 파일 오류입니다. 관리자 로그인 실패로 판정하지 않습니다.';el.classList.add('error');document.getElementById('retry').hidden=false;document.getElementById('retry').onclick=()=>location.reload();},15000);
window.addEventListener('error',()=>{const el=document.getElementById('status');el.textContent='연결 파일을 시작하지 못했습니다. 관리자 로그인 상태와 별개인 연결 오류입니다. 새로고침 후 다시 연결해주세요.';el.classList.add('error');});
</script><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js';
import {getAuth,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js';
import {getFirestore,collection,collectionGroup,query,limit,getDocs,getCountFromServer,startAfter,where} from 'https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js';
import {getStorage,ref as storageRef,list as storageList} from 'https://www.gstatic.com/firebasejs/11.9.1/firebase-storage.js';
const OPS='https://pound-operations.herestay-4226.chatgpt.site',$=id=>document.getElementById(id),params=new URLSearchParams(location.hash.slice(1)),nonce=params.get('nonce');let auth,db,storage,manifest,busy=false,complete=false,siteSession=null;
function status(message,error=false){$('status').textContent=message;$('status').classList.toggle('error',error);}
function imageRefs(v,key='',out=[]){if(typeof v==='string'){if(/^data:image\//i.test(v)||/image|thumbnail|cover|photo|picture/i.test(key)&&/^(https?:|gs:)\/\//.test(v))out.push(v);for(const m of v.matchAll(/<img\b[^>]*src=["']([^"']+)["']|!\[[^\]]*\]\(([^)]+)\)/gi))out.push(m[1]||m[2]);}else if(Array.isArray(v))v.forEach(x=>imageRefs(x,key,out));else if(v&&typeof v==='object')Object.entries(v).forEach(([k,x])=>imageRefs(x,k,out));return out;}
const imageUses=v=>imageRefs(v).length;
function decode(v){if('mapValue'in v)return Object.fromEntries(Object.entries(v.mapValue.fields||{}).map(([k,x])=>[k,decode(x)]));if('arrayValue'in v)return(v.arrayValue.values||[]).map(decode);if('integerValue'in v||'doubleValue'in v)return Number(v.integerValue??v.doubleValue);return v.timestampValue??v.stringValue??v.booleanValue??null;}
async function restQuery(path,group,filter,mode,last){const parts=path.split('/'),id=parts.pop(),root='https://firestore.googleapis.com/v1/projects/'+manifest.projectId+'/databases/'+encodeURIComponent(manifest.databaseId||manifest.firebaseConfig.firestoreDatabaseId||'(default)')+'/documents',parent=group?root:root+(parts.length?'/'+parts.join('/'):'');const q={from:[{collectionId:id,...(group?{allDescendants:true}:{})}],...(filter?{where:{fieldFilter:{field:{fieldPath:filter},op:'EQUAL',value:{stringValue:siteSession.localId}}}}:{}),...(mode==='scan'?{limit:250,orderBy:[{field:{fieldPath:'__name__'},direction:'ASCENDING'}],...(last?{startAt:{values:[{referenceValue:last.name}],before:false}}:{})}:{})};const body=mode==='count'?{structuredAggregationQuery:{structuredQuery:q,aggregations:[{alias:'total',count:{}}]}}:{structuredQuery:q};const r=await fetch(parent+(mode==='count'?':runAggregationQuery':':runQuery')+'?key='+encodeURIComponent(manifest.firebaseConfig.apiKey),{method:'POST',headers:{Authorization:'Bearer '+siteSession.idToken,'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Object.assign(new Error('사이트 DB 조회 제한'),{code:d.error?.status||r.status});if(mode==='count')return Number(d[0]?.result?.aggregateFields?.total?.integerValue||0);return d.filter(x=>x.document).map(x=>({id:x.document.name.split('/').pop(),name:x.document.name,data:()=>Object.fromEntries(Object.entries(x.document.fields||{}).map(([k,v])=>[k,decode(v)]))}));}
async function existingSession(){try{siteSession=JSON.parse(localStorage.getItem(manifest.sessionStorageKey)||'null');if(!siteSession?.idToken)return observe(null);const r=await fetch('https://identitytoolkit.googleapis.com/v1/accounts:lookup?key='+encodeURIComponent(manifest.firebaseConfig.apiKey),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({idToken:siteSession.idToken})});const d=await r.json(),u=d.users?.[0];if(!r.ok||!u)return observe(null);siteSession.localId=u.localId;return observe({uid:u.localId,email:u.email});}catch{status('기존 로그인 상태를 확인하지 못했습니다. 사이트에서 다시 로그인해주세요.',true);$('login').hidden=false;$('retry').hidden=false;}}
function storageMode(){return params.get('storageMode')||manifest.storageMode||'unknown';}
function initialStorage(){const mode=storageMode();return {status:mode==='unused'?'unused':'unqueried',mode,complete:false,scope:mode==='unused'?'Storage 미사용 · 집계 제외':'Storage 미조회 · DB 결과와 별도',checkedAt:null};}
async function storageCount(){
 if(storageMode()==='unused')return initialStorage();
 if(!manifest.firebaseConfig.storageBucket)return {status:'unconfigured',complete:false,scope:'Storage 설정 없음 · 집계 제외'};
 if(siteSession)return {status:'unknown',complete:false,scope:'기존 REST 로그인은 DB 조회만 지원합니다. Storage 사용 여부 미확인'};
 let files=0,images=0,pages=0;const queue=[{prefix:'',cursor:undefined}],deadline=Date.now()+8000;
 try{while(queue.length&&pages++<20){const next=queue.shift(),remaining=deadline-Date.now();if(remaining<=0)throw Object.assign(Error('Storage 조회 시간 초과'),{code:'storage/timeout'});let timer;const r=await Promise.race([storageList(storageRef(storage,next.prefix),{maxResults:1000,...(next.cursor?{pageToken:next.cursor}:{})}),new Promise((_,reject)=>{timer=setTimeout(()=>reject(Object.assign(Error('Storage 조회 시간 초과'),{code:'storage/timeout'})),remaining);})]).finally(()=>clearTimeout(timer));files+=r.items.length;images+=r.items.filter(x=>/\.(png|jpe?g|webp|gif|avif|svg|bmp|heic)$/i.test(x.name)).length;r.prefixes.forEach(x=>queue.push({prefix:x.fullPath}));if(r.nextPageToken)queue.unshift({prefix:next.prefix,cursor:r.nextPageToken});if(files>=10000)break;}return {status:files?'used':queue.length?'unknown':'empty',files,images,complete:!queue.length,error:'',scope:'수동 Storage 조회 · 이미지 확장자 기준',bucket:manifest.firebaseConfig.storageBucket,checkedAt:new Date().toISOString()};}
 catch(e){const absent=e.code==='storage/bucket-not-found';return {status:absent?'absent':'unknown',...(files?{files,images}:{}),complete:false,error:absent?'':String(e.code||'Storage 목록 조회 제한'),scope:absent?'Storage 버킷 없음 · 집계 제외':'Storage 사용 여부·접근 확인 필요 · DB 결과 유지',checkedAt:new Date().toISOString()};}
}
function offerReport(report){const link=new URL(OPS+'/');link.hash=new URLSearchParams({pound_report:JSON.stringify(report)}).toString();$('return').href=link.href;$('return').hidden=false;$('return').textContent='관제센터에 DB 결과 반영하기';if(window.opener)window.opener.postMessage({type:'pound-observe-result-v2',report},OPS);}

window.addEventListener('message',e=>{if(e.origin!==OPS||e.source!==window.opener||e.data?.type!=='pound-observe-saved-v2'||e.data.nonce!==nonce)return;status('관제센터에 조회 결과 저장 완료 · 창을 닫아도 됩니다.');$('return').textContent='관제센터로 돌아가기';$('return').href=OPS+'/?pound_connected='+encodeURIComponent(manifest.projectId);});
const time=v=>v?.toDate?v.toDate().toISOString():typeof v==='string'?v:null;
async function observe(user){clearTimeout(window.poundAuthTimer);if(complete||busy)return;if(!nonce||!/^[\w-]{40,100}$/.test(nonce)){status('관제센터의 관리자 접속·연결 버튼으로 이 페이지를 열어주세요.');return;}
 if(!user){status('이 사이트의 관리자 로그인이 필요합니다. 로그인 후 이 창으로 돌아오세요.');$('login').hidden=false;$('retry').hidden=false;return;}if(user.email?.toLowerCase()!=='cyber924@naver.com'){status('cyber924@naver.com 관리자 계정으로 접속해주세요.',true);$('login').hidden=false;return;}
 busy=true;$('retry').disabled=true;$('results').replaceChildren();const observed=[];
 try{let done=0;for(const entry of manifest.collections){const path=entry.path.replace(/\{uid\}/g,user.uid);if(/[{}]/.test(path)){observed.push({path,type:entry.type,group:entry.group===true,count:null,error:'하위 문서 ID별 탐색 필요',sample:[]});continue;}const row={path,type:entry.type,group:entry.group===true,count:null,error:'',imageDocuments:null,sample:[]};status(`관리자 로그인 확인 · 저장 경로 조회 ${++done} / ${manifest.collections.length}`);
  try{let ref=siteSession?null:row.group?collectionGroup(db,path):collection(db,path),ownerField='';try{row.count=siteSession?await restQuery(path,row.group,'','count'):(await getCountFromServer(ref)).data().count;row.countScope='path';}catch(original){let found=false;for(const field of entry.ownerFields||[]){try{const filtered=siteSession?null:query(ref,where(field,'==',user.uid));row.count=siteSession?await restQuery(path,row.group,field,'count'):(await getCountFromServer(filtered)).data().count;ref=filtered;ownerField=field;row.countScope='owner';found=true;break;}catch{}}if(!found)throw original;}if(/image/i.test(row.type+' '+path.split('/').pop()))row.imageDocuments=row.count;
   try{let last=null,documents=0,uses=0,completeScan=false;const unique=new Set();for(let page=0;page<20;page++){const docs=siteSession?{docs:await restQuery(path,row.group,ownerField,'scan',last)}:await getDocs(query(ref,...(last?[startAfter(last)]:[]),limit(250)));for(const d of docs.docs){const data=d.data(),refs=imageRefs(data);documents++;uses+=refs.length;refs.forEach(x=>unique.add(x));if(row.sample.length<20)row.sample.push({id:d.id,title:String(data.title||data.name||data.productName||data.topic||'제목 없음').slice(0,250),status:String(data.status||data.visibility||'미지정').slice(0,60),date:time(data.updatedAt)||time(data.createdAt)||null,fields:Object.entries(data).map(([name,v])=>({name,type:Array.isArray(v)?'array':v?.toDate?'timestamp':typeof v})),uses:refs.length});}last=docs.docs.at(-1);status(path+' · 이미지 참조 확인 '+documents.toLocaleString()+'개 문서');if(docs.docs.length<250||documents>=row.count){completeScan=true;break;}}row.imageScan={documents,uses,unique:unique.size,complete:completeScan};}catch(e){row.sampleError=String(e.code||'문서 목록 조회 제한');}
  }catch(e){row.error=String(e.code||'조회 확인 불가').slice(0,200);}observed.push(row);const el=document.createElement('div');el.className='row';el.textContent=path+' · '+(row.count===null?'조회 제한 ('+row.error+')':row.count.toLocaleString()+'개');$('results').append(el);}
  const report={storage:initialStorage(),nonce,projectId:manifest.projectId,databaseId:manifest.databaseId||manifest.firebaseConfig.firestoreDatabaseId||'(default)',adminEmail:user.email.toLowerCase(),uid:user.uid,collections:observed};offerReport(report);complete=true;history.replaceState(null,'',location.pathname);status(!observed.some(c=>typeof c.count==='number')?'DB 집계에 성공하지 못했습니다. 경로별 오류를 확인해주세요. 확인 불가 결과를 관제센터에 전달했습니다.':storageMode()==='unused'?'DB 조회 완료 · Storage 미사용 · 집계 제외. 아래 버튼으로 결과를 반영해주세요.':'DB 조회 완료 · 관제센터에 결과를 전달했습니다. 자동 반영되지 않으면 아래 버튼을 눌러주세요. Storage는 별도로 조회합니다.');$('login').hidden=true;$('retry').hidden=true;
  $('storage-check').hidden=storageMode()==='unused';$('storage-check').onclick=async()=>{const button=$('storage-check');button.disabled=true;try{status('DB 결과는 준비됐습니다. Storage만 확인 중입니다. 최대 8초 후 종료합니다.');report.storage=await storageCount();offerReport(report);status('DB 조회 완료 · '+(report.storage.scope||'Storage 확인 완료')+' · 아래 버튼으로 결과를 반영해주세요.');}catch{status('Storage 확인을 종료했습니다. 준비된 DB 결과를 반영해주세요.');}finally{button.disabled=false;}};

 }catch(e){status(e.message||'현황을 연결하지 못했습니다. 관제센터에서 다시 연결해주세요.',true);$('retry').hidden=false;}finally{busy=false;$('retry').disabled=false;}}
try{const r=await fetch('/pound-manifest.json',{cache:'no-store',signal:AbortSignal.timeout(12000)});if(!r.ok)throw new Error('서비스 연결 설정을 읽지 못했습니다.');manifest=await r.json();clearTimeout(window.poundBootTimer);if(manifest.protocol!=='pound-observe-v1'||!manifest.firebaseConfig)throw new Error('서비스 연결 설정이 올바르지 않습니다.');$('site').textContent=(manifest.name||manifest.projectId)+' · cyber924@naver.com';$('login').href=manifest.loginPath||'/login';const app=initializeApp(manifest.firebaseConfig,manifest.authAppName||'[DEFAULT]');auth=getAuth(app);window.poundAuthTimer=setTimeout(()=>{status('관리자 로그인 확인이 지연됩니다. 사이트에서 로그인한 뒤 다시 확인해주세요.',true);$('login').hidden=false;$('retry').hidden=false;},12000);db=getFirestore(app,manifest.databaseId||manifest.firebaseConfig.firestoreDatabaseId||'(default)');storage=getStorage(app);storage.maxOperationRetryTime=5000;if(manifest.sessionStorageKey){await existingSession();$('retry').onclick=existingSession;}else{onAuthStateChanged(auth,observe,()=>status('로그인 상태를 확인하지 못했습니다.',true));$('retry').onclick=()=>observe(auth.currentUser);}}catch(e){clearTimeout(window.poundBootTimer);status(e.message||'연결 페이지를 시작하지 못했습니다.',true);$('retry').hidden=false;$('retry').onclick=()=>location.reload();}
</script></body></html>
